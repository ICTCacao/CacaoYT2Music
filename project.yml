name: CacaoYT2Music
options:
  bundleIdPrefix: com.ictcacao
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  # YouTube の URL を入れると、音声だけを m4a（または mp3）にして保存する。実作業は yt-dlp + ffmpeg（Homebrew）
  CacaoYT2Music:
    type: application
    platform: macOS
    sources:
      - path: CacaoYT2Music
        excludes:
          - "Resources/*.plist"
      - path: LICENSE
        buildPhase: resources
    info:
      path: CacaoYT2Music/Resources/Info.plist
      properties:
        CFBundleDisplayName: CacaoYT2Music
        CFBundleName: CacaoYT2Music
        CFBundleShortVersionString: "1.0.3"
        CFBundleVersion: "1.0.3"
        LSMinimumSystemVersion: "14.0"
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja, en]
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "© 2026 ICTCacao"
    # yt-dlp / ffmpeg を外部プロセスとして動かし、任意のフォルダに保存するため、サンドボックスは使わない
    entitlements:
      path: CacaoYT2Music/Resources/CacaoYT2Music.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ictcacao.CacaoYT2Music
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  CacaoYT2Music:
    build:
      targets:
        CacaoYT2Music: all
    run:
      config: Debug
